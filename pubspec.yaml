name: real_estate
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  
  # State Management & Storage
  get: ^4.6.6
  get_storage: ^2.1.1
  
  # Networking
  dio: ^5.4.0
  
  # Images & Location
  image_picker: 1.1.0
  geolocator: ^10.1.0
  
  # URL Launcher
  url_launcher: ^6.2.0
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  smooth_page_indicator: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo1.png"
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: "assets/images/logo1.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/